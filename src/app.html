<!doctype html>
<html
	lang="en"
	style="
		background-color: var(--bg-main, #0f171a);
		background-image: var(--bg-gradient, none);
		color: var(--text-main, white);
		min-height: 100vh;
		padding: 0;
		margin: 0;
	"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Bangers&family=Chakra+Petch:wght@600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Unicase:wght@700&family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=MedievalSharp&family=Orbitron:wght@600;700;800&family=Outfit:wght@500;600;700;800&family=Pacifico&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Reggae+One&family=Rye&family=Share+Tech+Mono&family=Space+Grotesk:wght@500;600;700&family=Special+Elite&family=Syne:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body
		class="px-2 mx-2"
		data-sveltekit-preload-data="hover"
		style="
			background-color: var(--bg-main, #0f171a);
			background-image: var(--bg-gradient, none);
			min-height: 100vh;
			color: var(--text-main, white);
		"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
